        '200':
          description: Successful response with statements details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statements'
        '404':
          description: Statements not found
    put:
      summary: Update statements
      description: Update an existing statements
      operationId: updateStatements
      tags:
        - statements
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the statements
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementsInput'
      responses:
        '200':
          description: Statements updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statements'
        '404':
          description: Statements not found
    delete:
      summary: Delete statements
      description: Delete a statements by its ID
      operationId: deleteStatements
      tags:
        - statements
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the statements
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Statements deleted successfully
        '404':
          description: Statements not found
  /oauth/token-request:
    post:
      summary: Request OAuth access token
      operationId: token
      tags:
        - authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  scope:
                    type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                    - urn:ietf:params:oauth:grant-type:jwt-bearer
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
              required:
                - grant_type
  /statements:
    post:
      summary: Execute a SQL statement asynchronously
      operationId: executeStatement
      tags:
        - statements
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statementHandle:
                    type: string
                  statementStatusUrl:
                    type: string
                  resultSetMetaData:
                    type: object
                  data:
                    type: array
                  code:
                    type: string
                  sqlState:
                    type: string
                  message:
                    type: string
                  createdOn:
                    type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                statement:
                  type: string
                  description: SQL statement to execute
                timeout:
                  type: integer
                  description: Query timeout in seconds
                database:
                  type: string
                  description: Database context for the statement
                schema:
                  type: string
                  description: Schema context for the statement
                warehouse:
                  type: string
                  description: Warehouse to execute the statement
                role:
                  type: string
                  description: Role to use for execution
                bindings:
                  type: object
                  description: Parameter bindings for prepared statements
                parameters:
                  type: object
                  description: Session parameters
              required:
                - statement
  /statements/:statementHandle:
    get:
      summary: Get the status of a statement execution
      operationId: getStatementStatus
      tags:
        - statements
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statementHandle:
                    type: string
                  statementStatusUrl:
                    type: string
                  statementStatus:
                    type: string
                  code:
                    type: string
                  sqlState:
                    type: string
                  message:
                    type: string
                  createdOn:
                    type: integer
      parameters:
        - name: statementHandle
          in: path
          required: true
          description: Unique identifier for the statement
          schema:
            type: string
  /statements/:statementHandle/result:
    get:
      summary: Get the result of a completed statement
      operationId: getStatementResult
      tags:
        - statements
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultSetMetaData:
                    type: object
                  data:
                    type: array
                  code:
                    type: string
                  sqlState:
                    type: string
                  message:
                    type: string
      parameters:
        - name: statementHandle
          in: path
          required: true
          description: Unique identifier for the statement
          schema:
            type: string
        - name: partition
          in: query
          description: Result partition index (for large results)
          schema:
            type: integer
  /statements/:statementHandle/cancel:
    post:
      summary: Cancel a running statement
      operationId: cancelStatement
      tags:
        - statements
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statementHandle:
                    type: string
                  statementStatus:
                    type: string
                  message:
                    type: string
      parameters:
        - name: statementHandle
          in: path
          required: true
          description: Unique identifier for the statement to cancel
          schema:
            type: string
