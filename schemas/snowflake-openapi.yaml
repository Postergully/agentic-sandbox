openapi: 3.0.3
info:
  title: Snowflake Mock API
  version: 1.0.0
  description: Snowflake Data Cloud - SQL REST API mock server for AI agent testing
servers:
  - url: http://localhost:8080/api/v2
    description: WireMock Mock Server
paths:
  /api/v2/databases:
    get:
      summary: List all databases
      description: Retrieve a list of databases
      operationId: listDatabases
      tags:
        - databases
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response with list of databases
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Databases'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
    post:
      summary: Create a databases
      description: Create a new databases record
      operationId: createDatabases
      tags:
        - databases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabasesInput'
      responses:
        '201':
          description: Databases created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Databases'
  /api/v2/databases/{id}:
